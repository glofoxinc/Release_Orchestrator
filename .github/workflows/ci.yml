name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,calendar,daily_review]"

      - name: Lint with Ruff (pyproject rules)
        run: ruff check .

      - name: Critical lint gate (undefined names)
        # F821 = undefined name — blocks merges on import errors
        run: ruff check . --select=F821 --exit-non-zero-on-fix

      - name: Formatter check (hardened + quality-gate paths)
        # Scoped — full-repo ruff-format debt exists; avoid brittle global reformat gate.
        run: >
          ruff format --check
          release_mcp/wizard_store.py
          release_mcp/wizard.py
          release_mcp/slack_ops.py
          deploy_ops.py
          sharepoint_url.py
          slack_announce.py
          deployment_history.py
          tests/test_quality_gate.py
          tests/test_mcp_wizard.py
          tests/test_wizard_store.py
          tests/test_slack_announce.py
          tests/test_platform_ops.py
          tests/test_efficiency.py

      - name: Typed check (hardened modules only)
        run: >
          mypy --config-file=pyproject.toml
          release_mcp/wizard_store.py
          deploy_ops.py
          sharepoint_url.py
          slack_announce.py
          deployment_history.py

      - name: Hardened-module coverage gate
        run: >
          python -m pytest
          tests/test_quality_gate.py
          tests/test_mcp_wizard.py
          tests/test_wizard_store.py
          tests/test_slack_announce.py
          tests/test_platform_ops.py
          tests/test_efficiency.py
          tests/test_headless_ops.py
          --cov=release_mcp
          --cov=deploy_ops
          --cov=slack_announce
          --cov=sharepoint_url
          --cov=deployment_history
          --cov-report=term-missing
          --cov-fail-under=70

      - name: Release-critical parity suite
        run: >
          python -m pytest
          tests/test_release_critical_parity.py
          tests/test_post_qa_and_mcp_parity.py
          tests/test_mcp_wizard_parity.py
          -q --tb=short

      - name: Release notes E2E fixture
        run: python orchestrator/ops/test_release_notes_e2e.py

      - name: Daily Review Agent suite
        run: >
          python -m pytest
          tests/test_daily_review_agent.py
          tests/test_daily_review_guided.py
          tests/test_playwright_outlook_auth.py
          tests/test_preflight_and_failclosed.py
          tests/test_calendar_orchestrator.py
          tests/test_setup_mcp.py
          tests/test_mcp_daily_review_registration.py
          -q --tb=short

      - name: Full test suite
        run: python -m pytest tests/ -q
