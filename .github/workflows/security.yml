name: Security
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule: [{cron: '0 0 * * 1'}]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: pip install pip-audit bandit
      - run: pip-audit -r orchestrator/zones/config/deps/orchestrator/zones/config/deps/requirements.txt
      - run: bandit -r . -x ./orchestrator/zones/quality/tests,./venv,./.venv,./build,./dist,./orchestrator/zones/platform/automation/bin/launcher.pyw -ll
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: orchestrator/zones/platform/ci/gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
