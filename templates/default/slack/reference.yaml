# Canonical deployment Slack announce references — Customize BI / Glofox Analytics.
# Used by slack_reference.py and MCP slack_reference / slack_mcp_e2e_handoff.
#
# Operator-approved copy (2026-09-22): matches live #customize-bi-buddies posts.

gold_standard_keys:
  - SHIPIT-17191
  - SHIPIT-17036

body_rules:
  - "Open with Hello Team,"
  - "Line 2: Our upcoming deployment is scheduled for {Weekday, Month DD, YYYY}."
  - "Blank line, then: Deployment notes and the deployment ticket are below for reference:"
  - "Blank line, then SharePoint: Release Notes {version}.docx (live send uses Slack link format)"
  - "Service Desk: full ticket title — e.g. Glofox Insights Customize BI - Prod Deployment - Release Version {version}"
  - "Close with CC: line with required mentions per channel (no Thanks! line)"
  - "Squad CC: Sushma + Trent. Buddies CC: Sushma only."

channels:
  squad:
    name: insights-customize-squad
    cc_display: "@Sushma Bhamidipati @Trent Vanest"
    cc_keys: [sushma, trent]
  buddies:
    name: customize-bi-buddies
    cc_display: "@Sushma Bhamidipati"
    cc_keys: [sushma]

examples:
  SHIPIT-17191:
    ticket_key: SHIPIT-17191
    version: "2026.3.09.23"
    deploy_day: "Wednesday, September 23, 2026"
    sharepoint_label: "Release Notes 2026.3.09.23.docx"
    jira_url: "https://abcfinancial.atlassian.net/browse/SHIPIT-17191"
    ticket_summary: "Glofox Insights Customize BI - Prod Deployment - Release Version 2026.3.09.23"
    note: "Current gold standard — operator-approved 2026-09-22"
    squad_preview: |
      Hello Team,
      Our upcoming deployment is scheduled for Wednesday, September 23, 2026.
      Deployment notes and the deployment ticket are below for reference:

      SharePoint: Release Notes 2026.3.09.23.docx
      Service Desk: Glofox Insights Customize BI - Prod Deployment - Release Version 2026.3.09.23
      CC: @Sushma Bhamidipati @Trent Vanest
    buddies_preview: |
      Hello Team,
