      - name: "Rekha"
      - name: "Mona"
      - name: "Navya"
      - name: "Nikhath"
      - name: "Bharathi"
    leadership:
      - name: "Sushma Bhamidipati"
        email: "VenkataSuryaNagaSushma.Bhamidipati@abcfitness.com"
      - name: "Soumyakant Mishra"
        email: "Soumyakant.Mishra@abcfitness.com"
    qa:
      - name: "Akhil Sree Kumar"
        email: "akhil.sreekumar@abcfitness.com"
      - name: "Nikhila Sree Ramisetti"
