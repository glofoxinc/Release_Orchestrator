    release: []
    exclude:
      - name: "Gabriel Barbosa"
        email: "gabriel.barbosa@abcfitness.com"
      - name: "Erasmo García"
        email: "erasmo.garcia@abcfitness.com"
    sharepoint:
      hostname: "abcfinancial.sharepoint.com"
      site_path: "/teams/ABCFitnessSolutionsLLC-Glofox-Customize"
