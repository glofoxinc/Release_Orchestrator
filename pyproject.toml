[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-release-tool"
version = "3.5.0"
description = "Release Orchestrator - Streamlit app for Jira release deployment automation, ticket creation, AI triage, release notes, MCP server, and deployment tracking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lakshmi Yalamarti"}]
keywords = ["jira", "release", "deployment", "automation", "streamlit", "atlassian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "streamlit>=1.36.0",
    "requests>=2.32.0",
    "urllib3>=2.2,<2.9",
    "chardet>=5,<8",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "pywebview>=5.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pandas>=2.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
    "bandit>=1.7",
    "playwright>=1.40",
]
calendar = [
    "msal>=1.28.0",
    "pywin32>=306; sys_platform == 'win32'",
]
daily_review = [
    "msal>=1.28.0",
    "pywin32>=306; sys_platform == 'win32'",
]
platform = [
    "streamlit>=1.36.0",
    "pywebview>=5.0",
    "pandas>=2.0",
]
mcp = [
    "requests>=2.32.0",
    "urllib3>=2.2,<2.9",
    "chardet>=5,<8",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "mcp>=2.0.0",
]

[project.scripts]
jira-release-tool = "orchestrator.entry.cli:main"
release-orchestrator = "orchestrator.entry.cli:main"
daily-review-agent = "daily_review_agent.__main__:main"

[project.urls]
Homepage = "https://github.com/glofoxinc/release-orchestrator"
Repository = "https://github.com/glofoxinc/release-orchestrator"
Issues = "https://github.com/glofoxinc/release-orchestrator/issues"

[tool.setuptools]
py-modules = [
    "adf_builder", "ai_enhancer", "ai_ticket_creator", "ai_triage",
    "approver_validator", "assignment_ops", "browser_automation", "config",
    "confluence_publisher", "consolidation", "consolidation_detector",
    "deploy_draft", "deploy_ops", "deploy_prefill", "deployment_history",
    "diff_engine", "exclusion_ops", "gate_message_content", "glofox_jira_routing",
    "github_host_repo",
    "github_pr_gate", "integration_archive", "integration_readiness",
    "jira_client", "jira_client_http", "jira_teams", "linked_ticket_verifier", "ms_graph",
    "notifier", "outlook_mail", "operator_signoff", "production_readiness", "recovery_contract",
    "release_role_notify",
    "release_critical", "release_date_confirm", "release_defaults", "release_gates",
    "release_notes_compare", "release_session", "release_stats", "request_type_setter",
    "schedule_time", "service_ticket_plans", "session_persist", "session_restore",
    "sharepoint_receipt", "sharepoint_upload", "sharepoint_url", "shipit_post_create", "shipit_preflight",
    "shipit_reference", "shipit_test_mode", "slack_announce", "slack_assignee_notify", "slack_cascade",
    "slack_mcp_verify", "slack_message_content", "slack_reference", "tckt_reference",
    "program_pack", "release_calendar",
    "team_crew", "team_scope", "teams_meeting_content", "teams_schedule",
    "template_engine", "template_library", "ticket_validator", "workspace_profile",
]
packages = [
    "orchestrator",
    "orchestrator.entry",
    "orchestrator.ops",
    "orchestrator.ops.daily_review",
    "orchestrator.ops.legacy",
    "release_mcp",
    "mcp_server",
    "release_platform",
    "daily_review_agent",
    "generators",
    "common",
    "persistence",
    "ui",
    "ui.release_notes",
    "ui.service_ticket",
    "ui.ticket_review",
]
include-package-data = true

[tool.setuptools.package-dir]
"" = "orchestrator/zones/product/engine"
"orchestrator" = "orchestrator"
"orchestrator.entry" = "orchestrator/entry"
"orchestrator.ops" = "orchestrator/zones/platform/ops"
"release_mcp" = "orchestrator/zones/config/aliases/release_mcp"
"mcp_server" = "orchestrator/zones/config/aliases/mcp_server"
"release_platform" = "orchestrator/zones/config/aliases/release_platform"
"daily_review_agent" = "orchestrator/zones/config/aliases/daily_review_agent"
"generators" = "orchestrator/zones/config/aliases/generators"
"common" = "orchestrator/zones/config/aliases/common"
"persistence" = "orchestrator/zones/config/aliases/persistence"
"ui" = "orchestrator/zones/product/ui/ui"

[tool.setuptools.package-data]
"orchestrator" = [
    "zones/config/assets/templates/**/*",
    "zones/config/profiles/workspaces/*.yaml",
    "zones/config/profiles/workspaces/*.yml",
]

[tool.ruff]
target-version = "py310"
line-length = 120
cache-dir = "orchestrator/zones/runtime/cache/ruff"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["orchestrator/zones/quality/tests"]
cache_dir = "orchestrator/zones/runtime/cache/pytest"
markers = [
    "playwright: optional browser E2E (requires RUN_PLAYWRIGHT=1 and local Streamlit)",
    "real_scope: opt out of project-wide team scope bypass fixtures",
]

[tool.coverage.run]
data_file = "orchestrator/zones/runtime/cache/coverage"
source = [
    "release_mcp",
    "mcp_server",
    "deploy_ops",
    "slack_announce",
    "sharepoint_url",
    "deployment_history",
    "jira_client",
    "confluence_publisher",
]
omit = [
    "orchestrator/zones/quality/tests/*",
    "venv/*",
    ".venv/*",
    "release_platform/*",
    # Stdio entrypoints are covered by import/tool smoke, not unit fail-under.
    "release_mcp/server/implementation.py",
    "release_mcp/server/tools/*",
    "release_mcp/__main__.py",
    "mcp_server/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Proportionate gate for hardened modules only (not global repo coverage).
fail_under = 60

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
follow_imports = "skip"
pretty = true
# Scoped to hardened modules via CI/CLI path args — avoid brittle whole-repo strictness.
files = [
    "release_mcp/wizard_store.py",
    "deploy_ops.py",
    "sharepoint_url.py",
    "slack_announce.py",
    "deployment_history.py",
]
