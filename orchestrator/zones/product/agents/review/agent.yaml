# Daily Review Agent — feature-flagged, independent of Release Orchestrator UI workflow.
# Copy teams_schedule block from archive/teams_schedule.yaml into workspace.yaml when going live.
#
# Production: ONE meeting per on-demand run (next business day window) from fetched PIC/AN tickets.
# Calendar primary: Cursor Playwright MCP — schedule review call → agent drives Outlook web → calendar done.
# Unattended fallback: embedded Playwright script (legacy — embedded_playwright_fallback_enabled).
# daily_review_schedule_batch / batch_schedule: pilot smoke only — NOT the production job.

enabled: false

# on_demand — user says daily review welcome / run_live(force=true). No automatic 6 PM runs.
schedule_mode: on_demand

timezone: "Asia/Kolkata"

# Documented meeting time window (used when user requests a live run).
run_at: "18:00"

meeting:
  # Meeting window (next business day after each 6 PM run).
  start: "11:30"
  end: "12:00"
  day_offset_business_days: 1
  subject: "Glofox Customize BI — Daily Ticket Review"
  location: "Cross Fit"
  room_email: ""  # optional Exchange room mailbox — adds room as resource attendee
  skip_weekends: true

# Ticket fetch scope — outside-squad assignees (Gabriel, Erasmo) are NOT fetched by default.
ticket_scope:
  include_outside_squad_assignees: false  # set true only when explicitly requested

# Skip tickets still in Review/Passed QA but dev commented review is done.
review_filter:
  enabled: true
  check_comments: true
  skip_comment_phrases:
    - "review done"
    - "reviewed"
    - "review complete"
    - "review completed"
    - "daily review done"
    - "no further review"

# Jira Team filter — Glofox Insights Customize (PIC + AN).
jira_team:
  id: "317996a7-118a-4cf3-a3c6-04163516ed32"
  name: "Glofox Insights Customize"

# Status fetch mirrors Ticket Review Step 1 defaults (workspace ticket_review.default_checked_statuses).
# Resolved against live Jira status names per project.
projects:
  - PIC
  - AN

# Meeting invites — prefer TEAM_CREW_* from welcome onboard (.env).
# Required: leadership + QA + in-squad ticket assignees.
# Optional: review + release crew. Outside-squad assignees (e.g. Standard AN) are skipped.
# Fallback when TEAM_CREW_* not set:
required_attendees:
  - email: "VenkataSuryaNagaSushma.Bhamidipati@abcfitness.com"
    name: "Sushma Bhamidipati"
  - email: "Soumyakant.Mishra@abcfitness.com"
    name: "Soumyakant Mishra"

optional_attendees: []

# In-squad assignees when using agent.yaml fallback only (required | optional)
assignee_invite_type: "required"

# Teams calendar organizer (must match teams_schedule.organizer_upn when live).
organizer_upn: "lakshminarasimhanaidu.yalamarti@abcfitness.com"

# Demo call (orchestrator/zones/platform/ops/daily_review/demo_teams_call.py) — two-person smoke test only.
demo:
  subject: "Release Orchestrator — Daily Review Agent DEMO"
  duration_minutes: 15
  attendees:
    - email: "lakshminarasimhanaidu.yalamarti@abcfitness.com"
      name: "Lakshmi Narasimha"
    - email: "MohanKrishna.Sai@abcfitness.com"
      name: "Mohan Krishna Sai"

# Failure alerts — Teams self-chat DM to organizer when live schedule fails
alerting:
  on_schedule_failure: true
  channel: organizer_dm
  organizer_upn: "lakshminarasimhanaidu.yalamarti@abcfitness.com"

# Calendar scheduling (review calls):
# 1. Say **schedule review call** or run daily review live — Playwright MCP (primary).
# 2. Agent executes Outlook web steps; you say **calendar done** when invite is sent.
# 3. Embedded playwright_outlook only when embedded_playwright_fallback_enabled (Task Scheduler).
calendar_backend: "auto"
calendar_backends:
  - playwright_mcp
calendar_accept_outlook_without_join_url: true
calendar:
  playwright_mcp_primary_enabled: true
  playwright_mcp_fallback_enabled: true
  embedded_playwright_fallback_enabled: false

# Teams MCP — chat/summary and failure alerts only (not calendar scheduling).
teams:
  mcp_enabled: true
  post_summary: true
  # Glofox Customize Internal group chat
  summary_conversation_id: "19:bbe8394a2240441aafbe50d5f4c2d6b7@thread.v2"

# Slack — optional (Teams-first). Use Slack MCP in Cursor if needed.
slack:
  enabled: false
  channel_name: "insights-customize-squad"
  channel_id: "C08HB93PEVD"  # from archive/slack_announce.yaml
  post_summary: true
  schedule_reminder: false
  cc_user_ids:
    - "U08LDAQ7SDV"   # Sushma
    - "U062RM3T87Q"   # Soumyakant
  huddle:
    enabled: false
    post_link: false
