workspace:
  name: Example Org Team
  jira:
    base_url: https://yourorg.atlassian.net
  projects:
    - key: PROJ
      name: Example Project
  service_desk:
    enabled: true
  deployment:
    environment: Production
  slack_announce:
    enabled: true
    templates:
      body: slack/deploy_announce.txt.j2
    channels:
      - key: squad
        name: your-squad-channel
        cc: []
      - key: buddies
        name: your-buddies-channel
        cc: []
  release_gates:
    enabled: true
    templates:
      pre_review:
        body: gates/pre_review.txt.j2
      post_qa:
        body: gates/post_qa.txt.j2
    pre_review:
      enabled: false
      filter_ticket_review: false
      ready_statuses:
        - "In Review"
        - "Ready for Review"
      slack_notify: true
    post_qa:
      enabled: false
      filter_release_notes: false
      passed_statuses:
        - "Done"
        - "QA Passed"
      slack_notify: true
  release_notes:
    enabled: true
    team_name: "Example Team"
  sharepoint_upload:
    enabled: false
    hostname: "yourorg.sharepoint.com"
    site_path: "/sites/YourSite"
    folder_path: "Release Notes"
  teams_schedule:
    enabled: true
    organizer_upn: "release-coordinator@yourorg.com"
    default_timezone: "America/New_York"
    review_duration_minutes: 45
    deployment_duration_minutes: 120
    default_attendees:
      - { email: "lead@yourorg.com", name: "Release Lead" }
    templates:
      review:
        subject: "{{team_name}} Ticket Review — {{version}}"
        default_day_offset: -3
        default_time: "15:00"
      deployment:
        subject: "{{team_name}} Deployment — {{version}}"
        default_day_offset: 0
        default_time: "10:00"
  apps:
    ticket_review:
      enabled: true
      label: Ticket Review
    release_notes:
      enabled: true
      label: Release Notes
    service_ticket:
      enabled: true
      label: Service Ticket
    release_deployer:
      enabled: true
      label: Release Deployer
