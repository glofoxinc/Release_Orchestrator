version: "3.9"

services:
  jira-toolkit:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./.env:/app/.env:ro
      - ./workspace.yaml:/app/workspace.yaml
      - ./workspaces:/app/workspaces
      - ./templates:/app/templates
    environment:
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=10
    restart: unless-stopped
