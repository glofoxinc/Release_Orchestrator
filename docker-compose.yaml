version: "3.9"

services:
  jira-toolkit:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./.env:/app/.env:ro
      - ./profiles/workspace.yaml:/app/profiles/workspace.yaml
      - ./profiles/workspaces:/app/profiles/workspaces
      - ./assets/templates:/app/assets/templates
    environment:
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=10
    restart: unless-stopped
